name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v4
        with:
          cache: true
          install: true
      - run: mise run check
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: dist/
